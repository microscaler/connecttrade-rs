name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:17 UTC: has Connect Trade published a new spec?
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# GitHub-hosted runners: this repository is public, so pull requests from forks must never reach self-hosted
# machines.
jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the shared Microscaler toolchain (with rustfmt and clippy); rustup installs it on
      # first use, so this step only makes sure rustup is there.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: File sizes (no file over 512 KiB, no hand-written Rust file over 500 lines)
        run: scripts/check-file-sizes.sh
      - name: Generated code matches spec and overlay
        run: cargo xtask codegen --check
      - name: Clippy (the JSF-inspired profile in Cargo.toml and clippy.toml)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy without default features (models and sans-IO requests only)
        run: cargo clippy -p connecttrade --no-default-features -- -D warnings
      - name: Test (client against ct-mock, spec examples, mock against the spec's schemas)
        run: cargo test --workspace

  mock-image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ct-mock image
        run: docker build -f crates/ct-mock/Dockerfile -t ct-mock:ci .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8098:8098 --name ct-mock ct-mock:ci
          for i in $(seq 1 30); do curl -fsS localhost:8098/health && break; sleep 1; done
          curl -fsS localhost:8098/health | grep -q '"ct-mock"'
          docker stop ct-mock

  spec-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compare with Connect Trade's published spec
        run: scripts/refresh-spec.sh
