[workspace]
resolver = "2"
members = ["crates/connecttrade", "crates/ct-mock", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/microscaler/connecttrade-rs"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
