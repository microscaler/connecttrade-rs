[package]
name = "connecttrade"
version = "0.1.0"
description = "Client for the Connect Trade broker connectivity API: generated models and sans-IO requests, a blocking transport, and the order stream"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["trading", "broker", "connecttrade", "api-client"]
categories = ["api-bindings", "finance"]

[features]
default = ["ureq", "stream"]
# Blocking HTTPS transport (rustls).
ureq = ["dep:ureq"]
# The Streaming Broker API (wss://stream.connecttrade.com): orders, positions, balances.
stream = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }
tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
ct-mock = { path = "../ct-mock" }
ureq = { version = "3", default-features = false, features = ["json"] }

[lints]
workspace = true
