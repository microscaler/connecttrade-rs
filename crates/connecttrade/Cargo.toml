[package]
name = "connecttrade"
version = "0.1.0"
description = "Client for the Connect Trade broker connectivity API: generated models and sans-IO requests, a blocking transport, and the order stream"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["trading", "broker", "connecttrade", "api-client"]
categories = ["api-bindings", "finance"]

[features]
default = ["transport", "stream"]
# MayTransport: HTTPS over the may_minihttp client. The only HTTP client this crate uses (scripts/check-http-clients.sh).
transport = ["dep:may_minihttp", "dep:http"]
# The order stream: may_minihttp does the HTTP upgrade, tungstenite only frames (no "handshake": no HTTP client of its own).
stream = ["dep:may_minihttp", "dep:http", "dep:tungstenite", "dep:sha1", "dep:data-encoding", "dep:getrandom"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
# Pinned by release tag. v0.1.15 adds HttpClient::upgrade (microscaler/may_minihttp#20).
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", tag = "v0.1.15", optional = true, features = ["client"] }
http = { version = "0.2", optional = true }
tungstenite = { version = "0.29", optional = true, default-features = false }
sha1 = { version = "0.10", optional = true }
data-encoding = { version = "2", optional = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
ct-mock = { path = "../ct-mock" }
# The tests' own calls to the mock (OAuth link, price moves) go through the same HTTP client.
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", tag = "v0.1.15", features = ["client"] }

[lints]
workspace = true
